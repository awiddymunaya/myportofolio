{% extends 'base.html' %}
{% block meta %}
    <title>Daftar Akun Baru - {{ name }}</title>
{% endblock meta %}

{% block content %}
<section class="main-content">
    <div class="section-header" style="text-align: center; margin-bottom: 30px;">
        <h1 style="margin-top: 2rem;">Daftar Akun Baru</h1>
    </div>
    
    <div class="form-container" style="max-width: 500px; margin: 0 auto; padding: 30px; background-color: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <form method="POST">
            {% csrf_token %}
            <table class="custom-form-table" style="width: 100%; border-collapse: collapse;">
                {{ form.as_table }}
            </table>
            <div style="margin-top: 20px; text-align: center;">
                <button type="submit" style="width: 100%; padding: 10px; background-color: #D4AF37; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px;">Daftar</button>
            </div>
        </form>
        <p style="text-align: center; margin-top: 20px;">
            Sudah punya akun? <a href="{% url 'main:login' %}" style="color: #D4AF37; text-decoration: none; font-weight: bold;">Login di sini</a>
        </p>
    </div>
</section>
{% endblock content %}
