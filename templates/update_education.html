{% extends 'base.html' %}
{% load static %}

{% block meta %}
    <title>Edit Pendidikan - {{ name }}</title>
    <style>
        .custom-form-table th {
            text-align: left;
            vertical-align: top;
            padding: 12px 15px 12px 0;
            width: 35%;
            font-weight: bold;
            color: #333;
        }
        .custom-form-table td {
            padding: 8px 0;
        }
        .custom-form-table input, .custom-form-table textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        .custom-form-table input:focus, .custom-form-table textarea:focus {
            border-color: #4169E1;
            outline: none;
            box-shadow: 0 0 5px rgba(65, 105, 225, 0.3);
        }
    </style>
{% endblock meta %}

{% block content %}
    <section class="main-content">
        <div class="section-header" style="text-align: center; margin-bottom: 30px;">
            <h1 style="margin-top: 2rem;">Edit Data Pendidikan</h1>
        </div>
        
        <div class="form-container" style="max-width: 650px; margin: 0 auto; padding: 30px; background-color: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <form method="POST">
                {% csrf_token %}
                <table class="custom-form-table" style="width: 100%; border-collapse: collapse;">
                    {{ form.as_table }}
                </table>
                <div style="margin-top: 30px; text-align: right;">
                    <a href="{% url 'main:show_education' %}" style="text-decoration: none; color: #666; margin-right: 20px; font-weight: bold;">Batal</a>
                    <button type="submit" style="padding: 10px 25px; background-color: #4169E1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s;">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </section>
{% endblock content %}
